<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="crema" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0C978"/>
      <stop offset="1" stop-color="#D89B45"/>
    </linearGradient>
    <linearGradient id="porcelain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDE3EA"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="#E8C547" stroke-opacity="0.22" stroke-width="12"/>

  <!-- handle -->
  <path d="M702 418 h58 a132 132 0 0 1 0 264 h-42"
        fill="none" stroke="url(#porcelain)" stroke-width="58" stroke-linecap="round"/>

  <!-- cup body -->
  <path d="M272 386 h438 v152 a219 219 0 0 1 -219 219 h0 a219 219 0 0 1 -219 -219 z"
        fill="url(#porcelain)"/>

  <!-- crema surface -->
  <ellipse cx="491" cy="386" rx="219" ry="66" fill="url(#crema)"/>
  <ellipse cx="491" cy="386" rx="219" ry="66" fill="none" stroke="#B8802F" stroke-opacity="0.35" stroke-width="9"/>
  <!-- macchiato mark: the drop of milk -->
  <ellipse cx="491" cy="380" rx="86" ry="27" fill="#FFF6E4" opacity="0.95"/>

  <!-- saucer -->
  <rect x="238" y="812" width="500" height="52" rx="26" fill="url(#porcelain)" opacity="0.95"/>

  <!-- awake dot -->
  <circle cx="790" cy="252" r="106" fill="#0D1117"/>
  <circle cx="790" cy="252" r="74" fill="#2FD07C"/>
  <circle cx="790" cy="252" r="74" fill="none" stroke="#2FD07C" stroke-opacity="0.35" stroke-width="34"/>
</svg>
