[package]
name = "espresso-macchiato"
version = "0.3.0"
description = "Keep your machine awake and present. Menu bar / tray app for macOS and Linux."
authors = ["EspressoMacchiato contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "espresso_macchiato_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
directories = "6.0.0"
chrono = "0.4.45"
sysinfo = "0.39.6"
tauri-plugin-deep-link = "2.4.9"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
core-foundation = "0.10"
core-graphics = "0.24"
objc2 = "0.6.4"
objc2-event-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
x11rb = { version = "0.13", features = ["xtest", "screensaver"] }
evdev = "0.13"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "test-util"] }
